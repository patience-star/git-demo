  <path d="M235 112 Q262 120 272 128" fill="none" stroke="#dfe6ea" stroke-width="6" stroke-linecap="round"/>
  <path d="M185 240 L198 240" stroke="#333" stroke-width="5" stroke-linecap="round"/>
